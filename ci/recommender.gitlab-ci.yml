recommender:lint:python:
  image: python:3.11-slim
  stage: lint
  before_script: cd recommender
  script:
    - pip install black==23.3.0
    - black --check src/

recommender:lint:docker:
  image: hadolint/hadolint:v2.12.0-alpine
  stage: lint
  before_script: cd models/recommender
  script: hadolint Dockerfile --ignore DL3008 --ignore DL3015 --ignore DL3059

recommender:build:docker:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  stage: build
  variables:
    DOCKER_REGISTRY: registry.cri.epita.fr/mateo.lelong/nlp1
    DOCKER_IMAGE: $DOCKER_REGISTRY/models/recommender
    DOCKER_TAG: $CI_COMMIT_TAG
  script:
    - echo "{\"auths\":{\"$DOCKER_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR/models/recommender --dockerfile $CI_PROJECT_DIR/models/recommender/Dockerfile --destination $DOCKER_IMAGE:$DOCKER_TAG
  only:
    - tags
  except:
    - main
